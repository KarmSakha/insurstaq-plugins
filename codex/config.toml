# Add to ~/.codex/config.toml (or a trusted project's .codex/config.toml) to configure Codex
# directly instead of installing the InsurStaq plugin. It launches the same local server and,
# with the [hooks] tables below, InsurStaq Guard Hooks (InsurStaq 1.0.9 or later). Codex runs new
# hooks only after you trust them (Codex asks once). See ../docs/HOOKS.md.
[mcp_servers.insurstaq]
command = "/bin/sh"
# Prefers the tool bundled in InsurStaq.app, then `insurstaq` on PATH (see ../docs/REFERENCE.md).
args = ["-c", "for b in /Applications/InsurStaq.app/Contents/MacOS/insurstaq-cli \"$HOME/Applications/InsurStaq.app/Contents/MacOS/insurstaq-cli\"; do if [ -x \"$b\" ]; then exec \"$b\" mcp; fi; done; export PATH=\"$PATH:/usr/local/bin:$HOME/.local/bin\"; exec insurstaq mcp"]
startup_timeout_sec = 20
# insurstaq_verify_changes runs a Guard analysis; large repositories can take a while.
tool_timeout_sec = 300
enabled_tools = [
  "insurstaq_guard_status",
  "insurstaq_verify_changes",
  "insurstaq_list_regressions",
  "insurstaq_get_finding_summary",
  "insurstaq_request_fix",
  "insurstaq_build_delegate",
  "insurstaq_build_status",
  "insurstaq_project_rules",
]

# Guard Hooks. Each runs only the signed tool inside InsurStaq.app, by absolute path.
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "/Applications/InsurStaq.app/Contents/MacOS/insurstaq-cli hook codex SessionStart"
timeout = 5

[[hooks.PostToolUse]]
matcher = "apply_patch"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/Applications/InsurStaq.app/Contents/MacOS/insurstaq-cli hook codex PostToolUse"
timeout = 15

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "/Applications/InsurStaq.app/Contents/MacOS/insurstaq-cli hook codex Stop"
timeout = 75

[[hooks.PreToolUse]]
matcher = "Bash|apply_patch"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/Applications/InsurStaq.app/Contents/MacOS/insurstaq-cli hook codex PreToolUse"
timeout = 10
